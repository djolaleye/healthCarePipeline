name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:          # deploy.yml gate

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"        
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests (unit, generator end-to-end, template contract)
        run: python -m pytest -q

      - name: Lint template
        run: cfn-lint template.yaml

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build (no AWS credentials needed)
        run: sam build
