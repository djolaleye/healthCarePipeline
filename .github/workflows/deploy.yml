# Not setup yet: sam pipeline bootstrap --stage vitals
name: Deploy

# Manual
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write         # GitHub OIDC -> AWS

concurrency:
  group: vitals-pipeline-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'   # OIDC trust scoped to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PIPELINE_EXECUTION_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: sam build

      # --config-env ci: skip samconfig.toml's [default] section, whose
      # resolve_s3 = true conflicts with --s3-bucket ("Cannot use both").
      - name: SAM deploy
        run: >-
          sam deploy
          --config-env ci
          --stack-name vitals-pipeline
          --region "${{ vars.AWS_REGION }}"
          --s3-bucket "${{ vars.ARTIFACTS_BUCKET }}"
          --s3-prefix vitals-pipeline
          --role-arn "${{ vars.CLOUDFORMATION_EXECUTION_ROLE }}"
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset